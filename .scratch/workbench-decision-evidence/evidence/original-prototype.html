<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roll · 工作台原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141c;color:#d5dce7;font:13px/1.5 Inter,'Segoe UI','Microsoft YaHei',sans-serif;overflow:hidden}button,input{font:inherit}button{color:#a3afc1;background:transparent;border:0;padding:8px 12px;cursor:pointer;border-radius:4px}button:hover,button.active{background:#242e40;color:#fff}button:focus-visible,input:focus-visible{outline:2px solid #84aaff}input{background:#171e2a;border:1px solid #303b4c;border-radius:5px;color:#dce4f2;padding:7px 10px;width:210px}header{height:52px;border-bottom:1px solid #293140;display:flex;align-items:center;gap:22px;padding:0 18px}.brand{font-size:23px;font-weight:750;letter-spacing:1px;color:#f0f4ff}.blue{color:#8badff}.muted,small{color:#7e8da4}.sample{font-size:11px;color:#d5b77a;border:1px solid #665432;border-radius:4px;padding:2px 7px}.spacer{flex:1}.layout{height:calc(100dvh - 78px);display:grid;grid-template-columns:216px minmax(0,1fr) 296px;grid-template-rows:minmax(0,1fr) 190px}.left{grid-row:1/3;border-right:1px solid #293140;overflow:auto}.right{grid-column:3;grid-row:1/3;border-left:1px solid #293140;overflow:auto;background:#131924}.main{min-height:0;display:flex;flex-direction:column}.tabs{display:flex;gap:3px;border-bottom:1px solid #293140;padding:7px 9px;align-items:center}.tabs button.active{background:transparent;color:#9bbaff;box-shadow:inset 0 -2px #739afa;border-radius:0}.stock{width:100%;display:grid;grid-template-columns:1fr auto;text-align:left;padding:14px 14px;border-bottom:1px solid #202938;border-radius:0}.stock small{display:block;font-size:10px;letter-spacing:.5px}.stock b{font-weight:500}.stock em{font-style:normal;font-size:11px;display:block}.up{color:#ee6d78}.down{color:#42bca3}.section-label{padding:14px 14px 4px;font-size:10px;letter-spacing:1.2px;color:#6d7e97}.quote{display:flex;align-items:center;gap:16px;padding:15px 19px 8px}.quote h1{font-size:19px;margin:0}.price{font-size:26px;font-weight:600}.chartbar{display:flex;align-items:center;padding:0 10px 7px;gap:2px}.chartbar button{padding:5px 10px;font-size:12px}.chart{flex:1;min-height:0;position:relative;overflow:hidden;cursor:crosshair}svg{width:100%;height:100%;display:block}.charttip{position:absolute;left:20px;top:5px;font-size:11px;color:#8c9bb1;pointer-events:none}.bottom{grid-column:2;border-top:1px solid #293140;min-height:0;display:flex;flex-direction:column}.bottom-content{overflow:auto;padding:0 17px;flex:1}table{width:100%;border-collapse:collapse;text-align:left;font-variant-numeric:tabular-nums}th{font-size:11px;color:#718199;font-weight:400}td,th{padding:10px 8px;border-bottom:1px solid #232c3a}td:last-child,th:last-child{text-align:right}.panel{padding:20px}.panel h2{font-size:17px;margin:0 0 7px}.panel h3{font-size:13px;margin:25px 0 10px}.panel p{line-height:1.9;color:#a8b5c8}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#7186aa;margin:0 0 9px}.metric{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #263040}.primary{background:#7094ee;color:#0b1425;font-weight:600;width:100%;margin-top:20px}.primary:hover{background:#8dabf8;color:#0b1425}.range{height:8px;border-radius:10px;background:linear-gradient(90deg,#354960,#658be0,#47b9a6);margin:22px 0 8px}.range-labels{display:flex;justify-content:space-between;font-size:11px;color:#8fa1bb}.note{border-left:2px solid #7194e9;padding-left:12px}.footer{height:26px;display:flex;align-items:center;gap:18px;border-top:1px solid #293140;padding:0 14px;font-size:10px;color:#718199}.dot{color:#d5b77a}.reader{position:fixed;inset:52px 0 26px auto;width:min(720px,90vw);background:#18202d;box-shadow:-20px 0 60px #0008;z-index:5;display:flex;flex-direction:column;border-left:1px solid #39475d}.reader[hidden]{display:none}.reader.wide{width:calc(100vw - 216px)}.reader-head{display:flex;align-items:center;border-bottom:1px solid #344156;padding:10px 20px;gap:12px}.reader-body{padding:35px 45px;overflow:auto;max-width:950px;align-self:center;width:100%;font-size:14px;line-height:1.95}.reader-body h1{font-size:28px;color:#edf2ff}.reader-body h2{margin-top:30px;font-size:18px}.reader-body p{color:#b2bfd2}.layout.focus{grid-template-columns:0 minmax(0,1fr) 0;grid-template-rows:1fr 0}.focus .left,.focus .right,.focus .bottom{display:none}.empty{padding:30px 0;color:#8091aa}.news{padding:10px 0;border-bottom:1px solid #293140}.news small{margin-right:18px}@media(max-height:740px){.layout{grid-template-rows:minmax(0,1fr) 145px}.quote{padding-top:8px}}@media(max-width:1100px){.layout{grid-template-columns:175px minmax(0,1fr) 255px}.panel{padding:15px}header{gap:12px}.reader.wide{width:100vw}}@media(max-width:750px){.layout{grid-template-columns:0 minmax(0,1fr) 240px}.left{display:none}header input{width:130px}.quote{gap:7px}.price{font-size:20px}.sample{display:none}}
</style>
<header><span class="brand">roll<span class="blue">.</span></span><input id="search" placeholder="搜索股票 / 代码" aria-label="搜索股票"><span class="muted">行情工作台</span><span class="spacer"></span><span class="sample">交互原型 · 全部为样例数据</span><button id="focus">放大主图 ↗</button></header>
<div class="layout" id="layout"><aside class="left"><div class="tabs" id="listTabs"><button class="active">自选</button><button>持仓</button></div><div class="section-label">WATCHLIST / 关注列表</div><div id="stocks"></div></aside><main class="main"><div class="quote"><div><h1 id="name"></h1><small id="code"></small></div><span class="spacer"></span><span class="price up" id="price"></span><span class="up" id="change"></span></div><div class="chartbar"><button class="active">日线</button><span class="muted">前复权 · 示例</span><span class="spacer"></span><button id="zoomOut" aria-label="缩小图表">−</button><button id="zoomIn" aria-label="放大图表">＋</button><button id="reset">重置</button></div><div class="chart" id="chart"><div class="charttip" id="tip">MA 5 <span class="blue">—</span>　MA 20 <span style="color:#cfaa6f">—</span></div><svg id="plot" role="img" aria-label="样例日线 K 线和成交量，可用加减按钮缩放，左右方向键平移" tabindex="0"></svg></div></main><aside class="right"><div class="tabs" id="rightTabs"><button class="active">概览</button><button>投研</button><button>估值</button></div><div class="panel" id="panel"></div></aside><section class="bottom"><div class="tabs" id="bottomTabs"><button class="active">持仓</button><button>新闻</button><button>回测</button><span class="spacer"></span><small>演示账户</small></div><div class="bottom-content" id="bottomContent"></div></section></div>
<footer class="footer"><span class="dot">●</span> 原型预览<span id="state"></span><span class="spacer"></span>样例行情截至 2026-10-27 · CNY</footer>
<section class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="readerTitle"><div class="reader-head"><b id="readerTitle">研究报告</b><span class="spacer"></span><button id="expand">扩展阅读</button><button id="close">关闭 ✕</button></div><article class="reader-body" id="readerBody"></article></section>
<script>
// Throwaway visual prototype: approved single-screen layout; no API or persistence.
const data=[{name:'江西铜业',code:'600362',price:32.46,change:'+1.82%',base:28,report:true},{name:'紫金矿业',code:'601899',price:24.18,change:'+0.96%',base:21,report:true},{name:'招商银行',code:'600036',price:42.35,change:'−0.68%',base:39,report:false},{name:'贵州茅台',code:'600519',price:1492.50,change:'+0.42%',base:1400,report:false}];
let selected=0,right='概览',bottom='持仓',list='自选',count=65,offset=0,returnFocus=null;const $=id=>document.getElementById(id),money=n=>n.toFixed(2);
function stocks(){const q=$('search').value.toLowerCase();$('stocks').innerHTML=data.map((s,i)=>({s,i})).filter(({s,i})=>(list==='自选'||i<2)&&(s.name.includes(q)||s.code.includes(q))).map(({s,i})=>`<button class="stock ${i===selected?'active':''}" data-index="${i}"><span>${s.name}<small>SH ${s.code}</small></span><span><b>${money(s.price)}</b><em class="${s.change.includes('−')?'down':'up'}">${s.change}</em></span></button>`).join('')||'<div class="panel muted">没有匹配的股票</div>';document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{selected=+b.dataset.index;offset=0;count=65;render()})}
function panel(){const s=data[selected];if(right==='概览')$('panel').innerHTML=`<div class="eyebrow">MARKET SNAPSHOT</div><h2>${s.name}</h2><small>行情摘要 · 样例</small><div class="metric"><span class="muted">开盘</span><b>${money(s.price*.99)}</b></div><div class="metric"><span class="muted">最高 / 最低</span><b>${money(s.price*1.02)} / ${money(s.price*.98)}</b></div><div class="metric"><span class="muted">成交额</span><b>12.86 亿</b></div><div class="metric"><span class="muted">换手率</span><b>1.24%</b></div><h3>今日关注</h3><p class="note">观察价格变化与经营预期是否一致。</p><h3>关键条件</h3><p>等待下一期经营数据，关注利润率、现金流与资本开支的变化。</p><small>演示文案，不代表实际研究结论</small>`;else if(!s.report)$('panel').innerHTML=`<div class="eyebrow">${right==='投研'?'RESEARCH':'VALUATION'}</div><h2>${s.name} · ${right}</h2><div class="empty">暂无${right==='投研'?'报告':'估值'}<p>内容发布后将在这里显示。</p></div>`;else if(right==='投研')$('panel').innerHTML=`<div class="eyebrow">COMPANY RESEARCH</div><small>样例报告 · 2026-10-27 · v1</small><h2 style="margin-top:15px">${s.name}<br>经营观察与价值驱动</h2><p>从利润变化到现金流质量，跟踪经营假设的兑现情况。</p><h3>核心关注</h3><p>01　核心业务盈利弹性<br>02　资本开支与自由现金流<br>03　估值对经营条件的要求</p><button class="primary" id="openReport">打开完整报告 ↗</button><h3>历史报告</h3><div class="metric"><span>首次研究 · 示例</span><small>10-20</small></div>`;else $('panel').innerHTML=`<div class="eyebrow">CONDITIONAL VALUATION</div><h2>条件估值</h2><small>演示模型 · 2026-10-27 · v1</small><h3>情景区间 / 元</h3><div style="font-size:27px;color:#e0e9fa">${money(s.price*.82)} — ${money(s.price*1.2)}</div><div class="range"></div><div class="range-labels"><span>保守</span><span>基准</span><span>乐观</span></div><div class="metric" style="margin-top:16px"><span>样例现价</span><b>${money(s.price)}</b></div><div class="metric"><span>基准情景</span><b>${money(s.price*1.06)}</b></div><p>不同现金流和折现率假设下的结果范围。</p><button class="primary" id="openValue">查看估值详情 ↗</button><p><small>数字仅用于检查界面，不是公司估值结论。</small></p>`;if($('openReport'))$('openReport').onclick=()=>openReader(false);if($('openValue'))$('openValue').onclick=()=>openReader(true)}
function bottomPanel(){if(bottom==='持仓')$('bottomContent').innerHTML='<table><thead><tr><th>证券</th><th>数量</th><th>成本</th><th>现价</th><th>浮动盈亏</th></tr></thead><tbody>'+data.slice(0,2).map(s=>`<tr><td>${s.name}</td><td>1,000</td><td>${money(s.price*.94)}</td><td>${money(s.price)}</td><td class="up">+${money(s.price*60)}</td></tr>`).join('')+'</tbody></table>';else if(bottom==='新闻')$('bottomContent').innerHTML=`<div class="news"><small>10-27 17:30 · 样例</small>${data[selected].name}：季度经营数据关注事项</div><div class="news"><small>10-27 09:10 · 样例</small>行业供需变化与公司现金流观察</div>`;else $('bottomContent').innerHTML='<div class="empty">暂无回测结果 · 完成回测后在此查看收益曲线与关键指标。</div>'}
function bars(){let p=data[selected].base;return Array.from({length:120},(_,i)=>{let o=p,c=o*(1+Math.sin(i*1.7+selected)*.012+Math.cos(i*.34)*.005+.001);p=c;return{o,c,h:Math.max(o,c)*1.008,l:Math.min(o,c)*.992,v:25+Math.abs(Math.sin(i*2.2))*65}})}
function draw(){const box=$('chart').getBoundingClientRect(),w=box.width,h=box.height;if(w<1||h<1)return;const a=bars().slice(120-count-offset,120-offset),max=Math.max(...a.map(x=>x.h))*1.008,min=Math.min(...a.map(x=>x.l))*.992,ph=h*.7,step=(w-75)/a.length,y=p=>32+(max-p)/(max-min)*(ph-45);let svg='';for(let i=0;i<6;i++){let yy=32+i*(ph-45)/5;svg+=`<path d="M0 ${yy}H${w-60}" stroke="#26303e" stroke-dasharray="3 5"/><text x="${w-52}" y="${yy+4}" fill="#75859c" font-size="10">${money(max-(max-min)*i/5)}</text>`}a.forEach((b,i)=>{let x=12+i*step,col=b.c>=b.o?'#e66b79':'#39b69e';svg+=`<path d="M${x} ${y(b.h)}V${y(b.l)}" stroke="${col}"/><rect x="${x-step*.29}" y="${Math.min(y(b.o),y(b.c))}" width="${step*.58}" height="${Math.max(1,Math.abs(y(b.c)-y(b.o)))}" fill="${col}"/><rect x="${x-step*.29}" y="${h-30-b.v*h*.0015}" width="${step*.58}" height="${b.v*h*.0015}" fill="${col}" opacity=".45"/>`;if(i%12===0)svg+=`<text x="${x}" y="${h-10}" fill="#75859c" font-size="10">${i+120-count-offset+1} 日</text>`});[5,20].forEach((n,k)=>{let pts=a.map((b,i)=>i<n-1?'':`${12+i*step},${y(a.slice(i-n+1,i+1).reduce((v,b)=>v+b.c,0)/n)}`).filter(Boolean).join(' ');svg+=`<polyline points="${pts}" fill="none" stroke="${k?'#c7a56d':'#7d9ff5'}" stroke-width="1.4"/>`});svg+=`<path id="cross" stroke="#8799b4" stroke-dasharray="3 4" fill="none"/><text x="15" y="${ph+20}" fill="#7d8ba1" font-size="10">成交量 · 样例</text>`;$('plot').setAttribute('viewBox',`0 0 ${w} ${h}`);$('plot').innerHTML=svg;$('plot').onpointermove=e=>{let r=$('plot').getBoundingClientRect(),x=e.clientX-r.left,yy=e.clientY-r.top,b=a[Math.max(0,Math.min(a.length-1,Math.round((x-12)/step)))];$('cross').setAttribute('d',`M${x} 20V${h-25}M0 ${yy}H${w-60}`);$('tip').textContent=`开 ${money(b.o)}　高 ${money(b.h)}　低 ${money(b.l)}　收 ${money(b.c)} · 样例`};$('plot').onpointerleave=()=>{$('cross').setAttribute('d','')};}
function openReader(value){returnFocus=document.activeElement;$('reader').hidden=false;$('readerTitle').textContent=value?'估值详情':'完整研究报告';$('readerBody').innerHTML=`<div class="eyebrow">ROLL RESEARCH / 示例内容</div><h1>${data[selected].name}<br>${value?'条件估值与情景分析':'经营观察与价值驱动'}</h1><small>2026-10-27 · v1 · 所有内容为交互演示</small><h2>${value?'估值概览':'研究摘要'}</h2><p>这个阅读面板展示报告的阅读体验。正式内容由投研与估值工作流提供；当前文字和数字不代表真实分析。</p>${value?'<table><tr><th>情景</th><th>主要假设</th></tr><tr><td>保守</td><td>经营利润率承压，现金流改善较慢</td></tr><tr><td>基准</td><td>经营假设保持稳定</td></tr><tr><td>乐观</td><td>盈利能力改善，资本效率提高</td></tr></table>':'<h2>01 / 生意与竞争位置</h2><p>围绕收入来源、成本结构与竞争优势形成公司研究摘要。</p><h2>02 / 经营变化</h2><p>展示利润率、经营现金流和资本开支的变化，以及下一期需要关注的指标。</p>'}<h2>关键假设与敏感性</h2><p>现金流、正常化利润率、再投资与折现率共同影响条件估值。实际报告会提供相应数据图表。</p><h2>下一步关注</h2><p>跟踪后续经营披露，判断关键假设是否发生变化。</p>`;$('close').focus();$('layout').inert=true;document.querySelector('header').inert=true;}
function closeReader(){$('reader').hidden=true;$('layout').inert=false;document.querySelector('header').inert=false;returnFocus?.focus()}
function render(){const s=data[selected];$('name').textContent=s.name;$('code').textContent=`SH ${s.code} · A股 / CNY`;$('price').textContent=money(s.price);$('change').textContent=s.change;$('price').className='price '+(s.change.includes('−')?'down':'up');$('change').className=s.change.includes('−')?'down':'up';$('state').textContent=`${s.name} / ${right} / ${bottom}`;stocks();panel();bottomPanel();draw()}
function tabs(id,fn){$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{$(id).querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));fn(b.textContent);render()})}tabs('rightTabs',v=>right=v);tabs('bottomTabs',v=>bottom=v);tabs('listTabs',v=>list=v);$('search').oninput=stocks;$('close').onclick=closeReader;$('expand').onclick=()=>{$('reader').classList.toggle('wide');$('expand').textContent=$('reader').classList.contains('wide')?'恢复宽度':'扩展阅读'};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReader();if(!$('reader').hidden&&e.key==='Tab'){let buttons=[$('expand'),$('close')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons[1].focus()}else if(!e.shiftKey&&document.activeElement===buttons[1]){e.preventDefault();buttons[0].focus()}}});$('focus').onclick=()=>{$('layout').classList.toggle('focus');$('focus').textContent=$('layout').classList.contains('focus')?'恢复看板 ↙':'放大主图 ↗';draw()};$('zoomIn').onclick=()=>{count=Math.max(25,count-10);draw()};$('zoomOut').onclick=()=>{count=Math.min(100-offset,count+10);draw()};$('reset').onclick=()=>{count=65;offset=0;draw()};$('plot').onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();offset=Math.max(0,Math.min(120-count,offset+(e.key==='ArrowLeft'?5:-5)));draw()}};new ResizeObserver(draw).observe($('chart'));render();
</script></html>
