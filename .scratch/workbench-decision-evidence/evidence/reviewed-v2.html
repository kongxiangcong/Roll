else if(kind==='backtest')body=`<h2>固定规则探索回测 · ${record()}</h2><p>SMA5/20 v1；前日信号、次日开盘。模拟初始资金100,000元；历史样例窗口2026-07-01—10-27，热身06-01—06-30。公司行为前不安全区间排除至06-30（示例）。数据指纹 MOCK-PRICE-v2，不是真实工件。</p><p>费用：本示例累计200元，含佣金/税费/滑点；执行约束含停牌、涨跌停、T+1。精确逐笔费率与原件尚未接入，不可据此复现真实业绩。买入持有采用同窗口、资金、费用和交易限制；现金基准0%。</p><table><tr><th>净值检查点</th><th>期初</th><th>中间</th><th>期末</th></tr><tr><td>策略（费用后）</td><td>1.000</td><td>${no?'缺失':zero?'1.000':'0.960'}</td><td>${no?'缺失':zero?'1.000':loss?'0.968':'1.020'}</td></tr><tr><td>买入持有</td><td>1.000</td><td>0.970</td><td>1.010</td></tr><tr><td>现金</td><td>1.000</td><td>1.000</td><td>1.000</td></tr></table><p>收益 ${no?'缺失':zero?'0%':loss?'-3.20%':'+2.00%'}；最大回撤 ${no?'缺失':zero?'0%':'-4.00%'}；成交 ${no?'未知':zero?'0':'2'}；未成交1次：涨停约束。${zero?'无信号，无费用，期末空仓。':'期末仍持仓；按期末收盘计值，缺价时标为未知。'} </p><p>交易流水：${zero?'空表（零成交）':'逐笔成交/费用原件待接入，本fixture仅演示摘要；不声明可复现的实际回测结果。'}</p><p>样本外 / walk-forward / 显著性检验：未执行。有效独立样本：不足。三分段不等于滚动验证，重叠20日机会收益不构成策略净值。</p><p>历史模型诊断、连续影子策略、真实账户均是独立证据域，本页没有将它们混为同一绩效。</p>`;

returnFocus=document.activeElement;$('reader').hidden=false;$('readerTitle').textContent='决策证据 · 离线样例';$('readerBody').innerHTML='<small>全部为受控 fixture · 无真实 API 接入</small>'+body;$('readerBody').scrollTop=0;$('close').focus();$('layout').inert=true;document.querySelector('header').inert=true;controls.inert=true;}
