[project]
name = "roll"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "baostock==0.9.4",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "httpx==0.28.1",
    "pyarrow==25.0.1",
    "pypdf==6.19.0",
    "openai-codex==0.161.0",
    "openai-agents==0.23.1",
    "openai==3.26.0",
    "httpx2==2.13.1",
    "jsonschema==4.26.0",
    "pywin32==312; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
