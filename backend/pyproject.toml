[project]
name = "roll"
version = "2.1.0"
description = "Roll 个人盘后工作台"
requires-python = ">=3.12"
dependencies = [
    "akshare==1.19.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "uvicorn==0.52.4",
]

[project.scripts]
roll = "roll.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
