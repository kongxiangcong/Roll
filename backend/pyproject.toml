[project]
name = "roll"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4"]

[dependency-groups]
dev = ["pytest==9.0.2", "httpx==0.28.1"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
