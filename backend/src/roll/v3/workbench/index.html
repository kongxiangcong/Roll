<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>Roll · 盘后工作台</title>
  <link rel="stylesheet" href="/assets/workbench.css">
  <script type="module" src="/assets/workbench.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#overview" aria-label="Roll 盘后工作台">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Roll</span>
      </a>
      <nav class="seg-nav" aria-label="主导航">
        <a href="#overview" data-view="overview">全景台</a>
        <a href="#decision" data-view="decision">决策复盘</a>
        <a href="#lab" data-view="lab">研究实验室</a>
      </nav>
      <div class="topbar-actions">
        <span id="trade-date-pill" class="date-pill">—</span>
        <select id="book-select" class="book-select" aria-label="账户账本">
          <option value="real">实盘账本</option>
          <option value="m0a-example">演练账本</option>
        </select>
        <button id="sync-btn" type="button" class="btn btn-primary btn-sm">同步数据</button>
      </div>
    </div>
  </header>

  <main id="app" class="canvas" aria-live="polite"></main>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title">账户明细</h2>
        <button id="drawer-close" type="button" class="icon-btn" aria-label="关闭">✕</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="canvas">请启用 JavaScript。</p></noscript>
</body>
</html>
