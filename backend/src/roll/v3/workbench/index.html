<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>Roll · 盘后工作台</title>
  <link rel="stylesheet" href="/assets/workbench.css">
  <script type="module" src="/assets/workbench.js"></script>
</head>
<body>
  <a class="skip" href="#workspace">跳至工作区</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="#plans" aria-label="Roll 盘后工作台">Roll<span>.</span></a>
      <span class="app-name">盘后工作台</span>
      <span class="local">本地账本</span>
    </div>
  </header>
  <div class="workspace" id="workspace">
    <div class="heading">
      <h1 id="security-name">江西铜业</h1>
      <span id="security-code" class="security-code">600362.SH</span>
    </div>
    <form id="context" class="context">
      <label>证券代码<input name="symbol" value="600362.SH" required autocomplete="off"></label>
      <label>账户账本<input name="book_id" value="real" required autocomplete="off"></label>
      <label class="time-field">裁决截止时点（默认当前）<input name="as_of" placeholder="2026-11-26T16:00:00+08:00" autocomplete="off"></label>
      <button class="secondary">应用</button>
    </form>
    <nav aria-label="工作台导航">
      <a href="#plans">盘后计划</a>
      <a href="#research">个股研究</a>
      <a href="#experiments">策略实验</a>
      <a href="#account">账户镜像</a>
      <a href="#reviews">复盘登记</a>
    </nav>
    <main id="main" aria-label="工作台结果">
      <p class="empty">正在加载工作台…</p>
    </main>
  </div>
  <noscript><p class="workspace">请启用 JavaScript 使用本地工作台。</p></noscript>
</body>
</html>
